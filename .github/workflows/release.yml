name: Release

# Push a tag like v1.0.0 and GitHub builds installers for macOS (Apple Silicon
# + Intel) and Linux (deb, rpm, AppImage), then drafts a release with all of them.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust_target: ""
          - platform: ubuntu-22.04-arm
            args: ""
            rust_target: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - name: Tests
        if: matrix.rust_target != 'x86_64-apple-darwin'
        run: npm run build && cargo test --manifest-path src-tauri/Cargo.toml

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PracticeSpaceRecorder ${{ github.ref_name }}"
          releaseBody: |
            Download the file for your computer below, then follow the install steps in the README.

            * **Mac with Apple chip (M1 and newer):** `..._aarch64.dmg`
            * **Mac with Intel chip:** `..._x64.dmg`
            * **Linux (Ubuntu, Debian, Mint, Pop!_OS):** `..._amd64.deb`
            * **Linux (Fedora, openSUSE):** `....rpm`
            * **Any other Linux:** `....AppImage`
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
