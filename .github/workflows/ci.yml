name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, llvm-tools-preview
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: npm ci
      - run: npm run build
      - name: UI tests (coverage gate in vitest.config.ts)
        run: npm run coverage
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # device.rs (sound card), lib.rs (window) and main.rs need real hardware / a
      # display; everything else is gated.
      - name: Rust tests + coverage gate
        run: cargo llvm-cov --manifest-path src-tauri/Cargo.toml --ignore-filename-regex '(device|lib|main|testutil)\.rs' --fail-under-lines 97
