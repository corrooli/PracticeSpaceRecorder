<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb048"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8499"/>
    </marker>
    <style>
      .l { fill: none; stroke: #e8e4f0; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .d { fill: none; stroke: #8a8499; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 5 5; }
      .f { fill: #1e1d24; }
      .t { fill: #c9c3d6; font-size: 12px; letter-spacing: 2px; font-weight: 700; text-anchor: middle; }
      .s { fill: #8a8499; font-size: 13px; text-anchor: middle; }
      .tl { fill: #c9c3d6; font-size: 12px; letter-spacing: 2px; font-weight: 700; }
      .sl { fill: #8a8499; font-size: 13px; }
      .chip { fill: #1e1d24; stroke: #4a3a22; stroke-width: 1.5; }
      .ct { fill: #ffb048; font-size: 10.5px; letter-spacing: 1.5px; font-weight: 700; text-anchor: middle; }
      .cap { fill: #6f6a7c; font-size: 13px; font-style: italic; text-anchor: middle; }
      .h { fill: #ffb048; font-size: 14px; letter-spacing: 3px; font-weight: 700; }
      .ar { fill: none; stroke: #ffb048; stroke-width: 2.5; stroke-linecap: round; }
      .flow { fill: none; stroke: #ffb048; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 8; animation: m 1.2s linear infinite; }
      .opt { fill: none; stroke: #8a8499; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 8; animation: m 1.2s linear infinite; }
      .blink { animation: b 1.4s steps(1) infinite; }
      @keyframes m { to { stroke-dashoffset: -18; } }
      @keyframes b { 50% { opacity: 0.2; } }
      @media (prefers-reduced-motion: reduce) { .flow, .opt, .blink { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="398" rx="16" fill="#121116" stroke="#2b2a31" stroke-width="2"/>
  <text x="32" y="44" class="h">ONE TAKE, EVERYWHERE AT ONCE</text>

  <!-- interface -->
  <rect x="40" y="182" width="150" height="56" rx="6" class="l f"/>
  <circle cx="68" cy="210" r="11" class="l"/><line x1="68" y1="210" x2="62" y2="202" class="l"/>
  <circle cx="102" cy="210" r="11" class="l"/><line x1="102" y1="210" x2="110" y2="203" class="l"/>
  <rect x="134" y="202" width="6" height="22" rx="2" fill="#5fd38a"/>
  <rect x="146" y="194" width="6" height="30" rx="2" fill="#5fd38a"/>
  <rect x="158" y="206" width="6" height="18" rx="2" fill="#5fd38a"/>
  <rect x="170" y="198" width="6" height="26" rx="2" fill="#ffb048"/>
  <text x="115" y="300" class="t">YOUR BAND</text>
  <text x="115" y="320" class="s">through any interface</text>

  <line x1="200" y1="210" x2="232" y2="210" class="flow" marker-end="url(#arrow)"/>

  <!-- recording computer -->
  <rect x="250" y="166" width="140" height="88" rx="7" class="l f"/>
  <polyline points="265,204 273,196 279,212 285,188 291,218 297,200 303,208 311,184 317,224 323,194 329,214 335,202 343,190 349,216 355,198 363,208 375,204" fill="none" stroke="#ffb048" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="377" cy="178" r="5" fill="#ff4a32" class="blink"/>
  <path d="M235 254 H405 L395 268 H245 Z" class="l f"/>
  <text x="320" y="300" class="t">RECORDING COMPUTER</text>
  <text x="320" y="320" class="s">space, play, space</text>

  <path d="M410 210 C 440 210, 440 110, 470 110 H 652" class="flow" marker-end="url(#arrow)"/>
  <path d="M410 210 C 440 210, 440 210, 470 210 H 652" class="flow" marker-end="url(#arrow)"/>
  <path d="M410 210 C 440 210, 440 310, 470 310 H 652" class="flow" marker-end="url(#arrow)"/>
  <rect x="478" y="97" width="166" height="26" rx="13" class="chip"/>
  <text x="561" y="114" class="ct">WAV · AUTO MASTERED</text>
  <text x="742" y="107" class="tl">USB STICK</text>
  <text x="742" y="127" class="sl">take it home</text>
  <rect x="478" y="197" width="166" height="26" rx="13" class="chip"/>
  <text x="561" y="214" class="ct">WAV · RAW</text>
  <text x="742" y="207" class="tl">NAS</text>
  <text x="742" y="227" class="sl">every take, forever</text>
  <rect x="478" y="297" width="166" height="26" rx="13" class="chip"/>
  <text x="561" y="314" class="ct">MP3 · AUTO MASTERED</text>
  <text x="742" y="307" class="tl">BAND CHAT</text>
  <text x="742" y="327" class="sl">on every phone</text>

  <!-- usb stick -->
  <rect x="668" y="96" width="44" height="28" rx="5" class="l f"/>
  <path d="M712 102 H726 V118 H712" class="l"/>
  <rect x="716" y="106" width="4" height="3" fill="#e8e4f0"/><rect x="716" y="112" width="4" height="3" fill="#e8e4f0"/>
  <circle cx="680" cy="110" r="2.5" fill="#ffb048" class="blink"/>

  <!-- nas -->
  <rect x="672" y="182" width="48" height="56" rx="6" class="l f"/>
  <rect x="680" y="192" width="32" height="9" rx="2" class="l" stroke-width="2"/>
  <circle cx="706" cy="196.5" r="1.8" fill="#5fd38a"/>
  <rect x="680" y="206" width="32" height="9" rx="2" class="l" stroke-width="2"/>
  <circle cx="706" cy="210.5" r="1.8" fill="#ffb048" class="blink"/>
  <rect x="680" y="220" width="32" height="9" rx="2" class="l" stroke-width="2"/>
  <circle cx="706" cy="224.5" r="1.8" fill="#5fd38a"/>

  <!-- phone -->
  <rect x="677" y="280" width="38" height="62" rx="7" class="l f"/>
  <rect x="684" y="294" width="24" height="15" rx="4" fill="#ffb048"/>
  <path d="M693 298 L700 301.5 L693 305 Z" fill="#121116"/>
  <rect x="684" y="315" width="18" height="6" rx="3" fill="#3a3842"/><rect x="684" y="325" width="12" height="6" rx="3" fill="#3a3842"/>

  <text x="440" y="372" class="cap">all at once, in the background, while you play the next song</text>
</svg>
