<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#ffb048"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a8499"/>
    </marker>
    <style>
      .l { fill: none; stroke: #e8e4f0; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .d { fill: none; stroke: #8a8499; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 5 5; }
      .f { fill: #1e1d24; }
      .t { fill: #c9c3d6; font-size: 12px; letter-spacing: 2px; font-weight: 700; text-anchor: middle; }
      .s { fill: #8a8499; font-size: 13px; text-anchor: middle; }
      .h { fill: #ffb048; font-size: 14px; letter-spacing: 3px; font-weight: 700; }
      .ar { fill: none; stroke: #ffb048; stroke-width: 2.5; stroke-linecap: round; }
      .flow { fill: none; stroke: #ffb048; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 8; animation: m 1.2s linear infinite; }
      .opt { fill: none; stroke: #8a8499; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 1 8; animation: m 1.2s linear infinite; }
      .blink { animation: b 1.4s steps(1) infinite; }
      @keyframes m { to { stroke-dashoffset: -18; } }
      @keyframes b { 50% { opacity: 0.2; } }
      @media (prefers-reduced-motion: reduce) { .flow, .opt, .blink { animation: none; } }
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="288" rx="16" fill="#121116" stroke="#2b2a31" stroke-width="2"/>
  <text x="32" y="44" class="h">THE NAS</text>

  <g transform="translate(150 0)">
  <!-- recording computer -->
  <rect x="60" y="92" width="140" height="88" rx="7" class="l f"/>
  <polyline points="75,130 83,122 89,138 95,114 101,144 107,126 113,134 121,110 127,150 133,120 139,140 145,128 153,116 159,142 165,124 173,134 185,130" fill="none" stroke="#ffb048" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="187" cy="104" r="5" fill="#ff4a32"/>
  <path d="M45 180 H215 L205 194 H55 Z" class="l f"/>
  <text x="130" y="234" class="t">RECORDING COMPUTER</text>
  <text x="130" y="254" class="s">space to start, space to stop</text>

  <!-- network -->
  <line x1="226" y1="146" x2="334" y2="146" class="flow" marker-end="url(#arrow)"/>
  <text x="280" y="128" class="s">network share</text>

  <!-- nas -->
  <rect x="355" y="86" width="96" height="112" rx="8" class="l f"/>
  <rect x="367" y="100" width="72" height="16" rx="3" class="l"/>
  <rect x="367" y="122" width="72" height="16" rx="3" class="l"/>
  <rect x="367" y="144" width="72" height="16" rx="3" class="l"/>
  <rect x="367" y="166" width="72" height="16" rx="3" class="l"/>
  <circle cx="428" cy="108" r="2.5" fill="#5fd38a"/>
  <circle cx="428" cy="130" r="2.5" fill="#ffb048" class="blink"/>
  <circle cx="428" cy="152" r="2.5" fill="#5fd38a"/>
  <circle cx="428" cy="174" r="2.5" fill="#5fd38a"/>
  <text x="403" y="234" class="t">THE NAS</text>
  <text x="403" y="254" class="s">every take, safe and sound</text>

  </g>
</svg>
