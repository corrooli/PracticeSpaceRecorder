  <rect x="81.5" y="81.5" width="861" height="861" rx="188.5" fill="none" stroke="#fff" stroke-opacity=".14" stroke-width="3"/>
  <!-- waveform glass -->
  <rect x="166" y="194" width="692" height="250" rx="34" fill="url(#lip)"/>
  <rect x="170" y="198" width="684" height="242" rx="31" fill="url(#glass)"/>
