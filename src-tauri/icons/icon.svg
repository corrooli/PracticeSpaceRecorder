<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3842"/>
      <stop offset="1" stop-color="#16151b"/>
    </linearGradient>
    <linearGradient id="lip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="glass" cx=".5" cy=".35" r=".8">
      <stop offset="0" stop-color="#1b1920"/>
      <stop offset="1" stop-color="#07060a"/>
    </radialGradient>
    <radialGradient id="led" cx=".42" cy=".36" r=".7">
      <stop offset="0" stop-color="#ffd9cc"/>
      <stop offset=".35" stop-color="#ff5a3c"/>
      <stop offset="1" stop-color="#8a1608"/>
    </radialGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff4a2a" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ff4a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb048" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffcf8a"/>
      <stop offset="1" stop-color="#ffb048" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="brush" width="1024" height="6" patternUnits="userSpaceOnUse">
      <rect width="1024" height="2" fill="#fff" opacity=".025"/>
      <rect y="3" width="1024" height="1.5" fill="#000" opacity=".06"/>
    </pattern>
  </defs>
  <rect x="80" y="96" width="864" height="864" rx="190" fill="#000" opacity=".45" filter="url(#soft)"/>
