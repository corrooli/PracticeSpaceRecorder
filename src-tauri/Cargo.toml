[package]
name = "practice-space-recorder"
version = "1.2.0"
description = "Press space. Play loud. Press space. Your take is already on the NAS."
authors = ["corrooli"]
license = "AGPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[lib]
name = "psr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
cpal = "0.15"
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
axum = { version = "0.7", features = ["ws"] }
rust-embed = { version = "8", features = ["mime-guess"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
dirs = "5"
chrono = "0.4"
fs2 = "0.4"
local-ip-address = "0.6"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1"
futures-util = "0.3"
gethostname = "0.5"
tauri-plugin-dialog = "2"
mp3lame-encoder = "0.2"
ureq = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tokio-tungstenite = "0.24"
